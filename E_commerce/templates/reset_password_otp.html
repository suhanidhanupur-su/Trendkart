{% extends 'base.html' %}
{% block content %}

<div class="container my-4 my-md-5 px-3" style="max-width:440px;">
    <div class="card border-0 shadow-sm"
         style="background:#fff; border-radius:18px; padding:clamp(24px, 5vw, 36px) clamp(16px, 4vw, 32px);
                border:1.5px solid #FF4F81 !important;
                box-shadow:0 6px 24px rgba(255,79,129,0.1);">

        <div class="text-center mb-4">
            <div style="font-size:48px;">📧</div>
            <h2 class="fw-bold mt-2" style="color:#FF4F81; font-size:clamp(22px, 4vw, 26px);">Enter OTP</h2>
            <p class="text-muted" style="font-size:13px;">
                An OTP has been sent to:<br>
                <strong class="text-dark">{{ email }}</strong>
            </p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger text-center py-2" style="font-size:13px; border-radius:8px;">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label style="font-size:12px; font-weight:600; color:#FF4F81;">6-DIGIT OTP</label>
            <input type="text" name="otp" maxlength="6"
                   placeholder="_ _ _ _ _ _"
                   class="form-control mt-1 mb-4 text-center"
                   style="border:1.5px solid #ffc0d1; background:#FFF5F7;
                          border-radius:8px; padding:12px; font-size:20px;
                          font-weight:700; letter-spacing:6px; color:#FF4F81;"
                   required autofocus>

            <button type="submit"
                    class="btn text-white fw-bold w-100"
                    style="background:#FF4F81; border:none;
                           border-radius:10px; padding:12px; font-size:15px;
                           cursor:pointer;">
                ✅ Verify OTP
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'forgot_password' %}"
               class="text-muted"
               style="font-size:13px; text-decoration:none;">
                ← Resend OTP
            </a>
        </div>
    </div>
</div>

{% endblock %}
