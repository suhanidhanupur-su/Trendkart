{% extends 'base.html' %}
{% block content %}

<div class="container my-4 my-md-5 px-3" style="max-width:440px;">
    <div class="card border-0 shadow-sm"
         style="background:#fff; border-radius:18px; padding:clamp(24px, 5vw, 36px) clamp(16px, 4vw, 32px);
                border:1.5px solid #FF4F81 !important;
                box-shadow:0 6px 24px rgba(255,79,129,0.1);">

        <div class="text-center mb-4">
            <div style="font-size:48px;">🔐</div>
            <h2 class="fw-bold mt-2" style="color:#FF4F81; font-size:clamp(22px, 4vw, 26px);">Forgot Password?</h2>
            <p class="text-muted" style="font-size:13px;">
                Enter your email address — we'll send you an OTP to reset your password.
            </p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert {% if 'success' in message.tags %}alert-success{% else %}alert-danger{% endif %} text-center py-2"
             style="font-size:13px; border-radius:8px;">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label style="font-size:12px; font-weight:600; color:#FF4F81;">EMAIL ADDRESS</label>
            <input type="email" name="email"
                   placeholder="name@example.com"
                   class="form-control mt-1 mb-4"
                   style="border:1.5px solid #ffc0d1; background:#FFF5F7;
                          border-radius:8px; padding:12px 14px; font-size:14px;"
                   required autofocus>

            <button type="submit"
                    class="btn text-white fw-bold w-100"
                    style="background:#FF4F81; border:none;
                           border-radius:10px; padding:12px; font-size:15px;
                           cursor:pointer;">
                Send OTP →
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'login' %}"
               class="text-muted"
               style="font-size:13px; text-decoration:none;">
                ← Back to Login
            </a>
        </div>
    </div>
</div>

{% endblock %}
